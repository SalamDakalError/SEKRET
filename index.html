<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Journey For You ✨</title>
  <style>
    /* ==========================================================================
       1. VARIABLES & BASE STYLES
       ========================================================================== */
    :root {
      --bg-gradient: linear-gradient(135deg, #1a0b2e 0%, #31145a 50%, #4a154b 100%);
      --primary-gold: #ffd700;
      --pastel-pink: #ff758f;
      --mint-green: #70e000;
      --vibrant-purple: #7209b7;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-blur: blur(12px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Global Utilities */
    .hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      max-width: 90%;
      width: 480px;
      z-index: 10;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Primary Interactive Button */
    .btn-glow {
      background: linear-gradient(45deg, var(--pastel-pink), var(--vibrant-purple));
      border: none;
      color: white;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 143, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 143, 0.6);
    }
    .btn-glow:active {
      transform: translateY(1px);
    }

    /* Canvas overlay for confetti bursts */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }

    /* ==========================================================================
       STAGE 1: THE LOCKED DOOR
       ========================================================================== */
    #stage-1 .prompt-text {
      font-size: 1.2rem;
      margin-top: 2rem;
      letter-spacing: 1px;
      animation: pulseText 2s infinite ease-in-out;
      color: rgba(255, 255, 255, 0.85);
    }

    .gift-scene {
      position: relative;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 600px;
    }

    .gift-box {
      width: 100px;
      height: 100px;
      background: var(--pastel-pink);
      position: relative;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      animation: floatBox 3s infinite ease-in-out;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    .gift-box::before {
      content: '';
      position: absolute;
      top: 0; left: 42px;
      width: 16px; height: 100%;
      background: var(--primary-gold);
    }
    .gift-box::after {
      content: '';
      position: absolute;
      top: 42px; left: 0;
      width: 100%; height: 16px;
      background: var(--primary-gold);
    }
    .gift-lid {
      position: absolute;
      top: -12px; left: -5px;
      width: 110px; height: 20px;
      background: #ff477e;
      border-radius: 4px;
      box-shadow: 0 4px 5px rgba(0,0,0,0.2);
      z-index: 2;
    }
    .gift-lid::before {
      content: '';
      position: absolute;
      left: 47px; top: 0;
      width: 16px; height: 100%;
      background: var(--primary-gold);
    }
    .gift-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, rgba(255,215,0,0) 70%);
      animation: auraGlow 3s infinite ease-in-out;
      pointer-events: none;
    }

    .explode-out {
      animation: triggerExplode 0.6s forwards cubic-bezier(0.1, 0.8, 0.3, 1) !important;
    }

    /* ==========================================================================
       STAGE 2: VERIFICATION
       ========================================================================== */
    #stage-2 h2 {
      margin-bottom: 1.5rem;
      background: linear-gradient(45deg, #fff, var(--pastel-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .verification-hub {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 20px;
      height: 60px;
      position: relative;
    }
    #btn-no {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: #ddd;
      padding: 12px 32px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      z-index: 50;
    }

    /* ==========================================================================
       STAGE 3: THE VIRTUAL CAKE
       ========================================================================== */
    .cake-container {
      position: relative;
      height: 200px;
      margin: 2rem 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .cake {
      width: 180px;
      height: 90px;
      background: #6d597a;
      border-radius: 10px 10px 4px 4px;
      position: relative;
      box-shadow: inset 0 8px 0 rgba(255,255,255,0.1);
    }
    .cake::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 30px;
      background: var(--pastel-pink);
      border-radius: 10px 10px 20px 20px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }
    .cake-stripe {
      position: absolute;
      top: 50px; left: 0; width: 100%; height: 12px;
      background: var(--primary-gold);
    }
    .candle-group {
      position: absolute;
      bottom: 90px;
      left: 0; width: 100%;
      display: flex;
      justify-content: center;
      gap: 22px;
    }
    .candle {
      width: 10px;
      height: 40px;
      background: linear-gradient(to right, #48cae4, #00b4d8);
      position: relative;
      border-radius: 2px 2px 0 0;
    }
    .candle:nth-child(2) { background: linear-gradient(to right, #b5179e, #7209b7); }
    .candle:nth-child(3) { background: linear-gradient(to right, #9bb54a, #70e000); }

    .candle::before {
      content: '';
      position: absolute;
      top: -6px; left: 4px;
      width: 2px; height: 6px;
      background: #333;
    }
    .flame {
      position: absolute;
      top: -18px; left: 1px;
      width: 8px; height: 14px;
      background: radial-gradient(ellipse at bottom, #ffea00 0%, #ff5400 100%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 10px rgba(255,166,0,0.8);
      animation: flicker 0.6s infinite alternate ease-in-out;
      transform-origin: bottom center;
      transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    }
    .flame.extinguished {
      opacity: 0 !important;
      transform: scale(0);
    }

    .banner-drop {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: linear-gradient(45deg, var(--primary-gold), #ffb703);
      color: #1a0b2e;
      padding: 16px;
      font-weight: 800;
      font-size: 1.6rem;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 150;
      transition: top 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .banner-drop.active {
      top: 40px;
    }

    /* ==========================================================================
       STAGE 4: THE HEARTFELT LETTER
       ========================================================================== */
    #stage-4 {
      width: 100%;
      margin-top: 1.5rem;
      border-top: 1px solid var(--glass-border);
      padding-top: 2rem;
      animation: fadeIn 1s ease-out;
    }

    .letter-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: bounceGentle 2s infinite ease-in-out;
    }
    
    .typewriter-box {
      min-height: 120px;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .typewriter-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #f1f1f1;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .cursor {
      display: inline-block;
      width: 3px;
      background-color: var(--pastel-pink);
      margin-left: 4px;
      animation: blink 0.8s infinite;
    }

    /* ==========================================================================
       DOM BALLOONS ENGINE
       ========================================================================== */
    .balloon {
      position: fixed;
      bottom: -120px;
      width: 60px;
      height: 75px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      z-index: 5;
      pointer-events: none;
      opacity: 0.85;
    }
    .balloon::after {
      content: "";
      position: absolute;
      bottom: -12px; left: 28px;
      width: 2px; height: 14px;
      background-color: rgba(255,255,255,0.4);
    }

    /* ==========================================================================
       KEYFRAME ANIMATIONS DEFINITIONS
       ========================================================================== */
    @keyframes floatBox {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes bounceGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes auraGlow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes triggerExplode {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.5; filter: blur(2px); }
      100% { transform: scale(0); opacity: 0; }
    }
    @keyframes flicker {
      0% { transform: scaleX(1) rotate(-2deg); }
      100% { transform: scaleX(1.1) rotate(3deg) translateY(-1px); }
    }
    @keyframes blink {
      50% { background-color: transparent; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Audio Node Hook Framework -->
  <audio id="bg-music" loop></audio>

  <!-- Interactive Confetti Canvas Layer -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Elastic Dropped Down Notification Banner -->
  <div class="banner-drop" id="birthday-banner">
    🎉 HAPPY BIRTHDAY! 🎂
  </div>

  <!-- MAIN APP WRAPPER SYSTEM -->
  <main class="glass-card" id="main-card">
    
    <!-- STAGE 1: THE LOCKED DOOR -->
    <div id="stage-1">
      <div class="gift-scene">
        <div class="gift-glow"></div>
        <div class="gift-box" id="gift-box-target" title="Click to unpack!">
          <div class="gift-lid"></div>
        </div>
      </div>
      <p class="prompt-text">A special package has arrived.<br>Click to unlock.</p>
    </div>

    <!-- STAGE 2: VERIFICATION HUB -->
    <div id="stage-2" class="hidden">
      <h2>🔒 Identity Verification</h2>
      <p style="color: #ccc; font-size: 0.95rem; line-height: 1.4;">Before configuration sequences can initialize, please verify security criteria:</p>
      <p style="margin-top: 1rem; font-weight: 600; font-size: 1.1rem; color: var(--primary-gold);">Are you ready for your surprises?</p>
      
      <div class="verification-hub">
        <button class="btn-glow" id="btn-yes">Yes, absolute readiness!</button>
        <button id="btn-no">No</button>
      </div>
    </div>

    <!-- STAGE 3: CAKE ASSEMBLY -->
    <div id="stage-3" class="hidden">
      <div class="cake-container">
        <div class="candle-group">
          <div class="candle"><div class="flame"></div></div>
          <div class="candle"><div class="flame"></div></div>
          <div class="candle"><div class="flame"></div></div>
        </div>
        <div class="cake">
          <div class="cake-stripe"></div>
        </div>
      </div>
      
      <button class="btn-glow" id="btn-blow">💨 Blow out the candles</button>
    </div>

    <!-- STAGE 4: THE DIGITAL MEMORY LETTER -->
    <div id="stage-4" class="hidden">
      <div class="letter-icon">✉️</div>
      <div class="typewriter-box">
        <span class="typewriter-text" id="wish-text"></span><span class="cursor" id="txt-cursor">|</span>
      </div>
    </div>

  </main>

  <!-- ==========================================================================
       JAVASCRIPT APPLICATION CORE LOGIC
       ========================================================================== -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      // Node Elements References Map
      const audioNode = document.getElementById("bg-music");
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      
      const cardContainer = document.getElementById("main-card");
      const bdayBanner = document.getElementById("birthday-banner");
      
      const stage1 = document.getElementById("stage-1");
      const stage2 = document.getElementById("stage-2");
      const stage3 = document.getElementById("stage-3");
      const stage4 = document.getElementById("stage-4");
      
      const giftBox = document.getElementById("gift-box-target");
      const btnYes = document.getElementById("btn-yes");
      const btnNo = document.getElementById("btn-no");
      const btnBlow = document.getElementById("btn-blow");
      
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      /* ==========================================================================
         A. AUDIO ROUTING SYSTEM
         ========================================================================== */
      function loadAndPlayAudio(trackPath) {
        audioNode.src = trackPath;
        audioNode.load();
        audioNode.play().catch(err => {
          console.log("Autoplay context restriction caught:", err);
        });
      }

      /* ==========================================================================
         B. LIGHTWEIGHT CANVAS CONFETTI MATRIX ENGINE
         ========================================================================== */
      let confettiArray = [];
      let confettiAnimationId = null;

      class ConfettiParticle {
        constructor(x, y, isBurst = false) {
          this.x = x;
          this.y = y;
          this.size = Math.random() * 8 + 4;
          this.color = [`#ffd700`, `#ff758f`, `#70e000`, `#7209b7`, `#48cae4`][Math.floor(Math.random() * 5)];
          
          if (isBurst) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 4;
            this.speedX = Math.cos(angle) * speed;
            this.speedY = Math.sin(angle) * speed;
          } else {
            this.speedX = Math.random() * 2 - 1;
            this.speedY = Math.random() * 3 + 2;
          }
          this.rotation = Math.random() * 360;
          this.rotationSpeed = Math.random() * 4 - 2;
          this.opacity = 1;
          this.isBurst = isBurst;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.rotation += this.rotationSpeed;
          
          if (this.isBurst) {
            this.speedY += 0.15;
            this.opacity -= 0.015;
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate((this.rotation * Math.PI) / 180);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.opacity;
          ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
          ctx.restore();
        }
      }

      function triggerBurstConfetti(count, originX, originY) {
        for (let i = 0; i < count; i++) {
          confettiArray.push(new ConfettiParticle(originX, originY, true));
        }
        initiateConfettiLoop();
      }

      function triggerStreamConfetti() {
        for (let i = 0; i < 120; i++) {
          confettiArray.push(new ConfettiParticle(Math.random() * canvas.width, Math.random() * -50, false));
        }
        initiateConfettiLoop();
      }

      function initiateConfettiLoop() {
        if (!confettiAnimationId) {
          renderConfettiFrame();
        }
      }

      function renderConfettiFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        confettiArray = confettiArray.filter(p => {
          p.update();
          p.draw();
          if (p.opacity <= 0) return false;
          if (!p.isBurst && p.y > canvas.height) return false;
          return true;
        });

        if (confettiArray.length > 0) {
          confettiAnimationId = requestAnimationFrame(renderConfettiFrame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          confettiAnimationId = null;
        }
      }

      /* ==========================================================================
         C. PROCEDURAL BALLOON GENERATOR ENGINE
         ========================================================================== */
      function createBalloonsWave(count) {
        const hexColors = ['#ff758f', '#7209b7', '#48cae4', '#ffd700', '#70e000'];
        
        for (let i = 0; i < count; i++) {
          const balloonNode = document.createElement("div");
          balloonNode.classList.add("balloon");
          
          const color = hexColors[Math.floor(Math.random() * hexColors.length)];
          const sizeScale = Math.random() * 0.5 + 0.75;
          const driftX = Math.random() * window.innerWidth;
          const duration = Math.random() * 4 + 5;
          
          balloonNode.style.backgroundColor = color;
          balloonNode.style.left = `${driftX}px`;
          balloonNode.style.transform = `scale(${sizeScale})`;
          balloonNode.style.boxShadow = `inset -6px -6px 0 rgba(0,0,0,0.15), 0 10px 20px rgba(0,0,0,0.2)`;
          
          balloonNode.style.animation = `riseUp ${duration}s linear forwards`;
          
          document.body.appendChild(balloonNode);
          
          setTimeout(() => {
            balloonNode.remove();
          }, duration * 1000);
        }
      }

      const styleSheet = document.createElement("style");
      styleSheet.innerText = `
        @keyframes riseUp {
          0% { bottom: -120px; transform: translateX(0); }
          30% { transform: translateX(25px) cubic-bezier(0.4, 0, 0.2, 1); }
          60% { transform: translateX(-25px); }
          100% { bottom: 105vh; transform: translateX(10px); }
        }
      `;
      document.head.appendChild(styleSheet);

      /* ==========================================================================
         D. STAGE WORKFLOWS TRANSITIONS & LOGIC
         ========================================================================== */

      // --- STAGE 1: BOX SELECTION ---
      giftBox.addEventListener("click", () => {
        giftBox.classList.add("explode-out");
        
        const rect = giftBox.getBoundingClientRect();
        triggerBurstConfetti(45, rect.left + rect.width/2, rect.top + rect.height/2);
        
        setTimeout(() => {
          stage1.classList.add("hidden");
          stage2.classList.remove("hidden");
        }, 550);
      });

      // --- STAGE 2: ESCAPE INTERACTION ---
      function fleeNoButton() {
        const cardRect = cardContainer.getBoundingClientRect();
        const padding = 20;
        
        const maxX = window.innerWidth - btnNo.offsetWidth - padding;
        const maxY = window.innerHeight - btnNo.offsetHeight - padding;
        
        let randomX = Math.random() * maxX;
        let randomY = Math.random() * maxY;
        
        if (randomX > cardRect.left - 40 && randomX < cardRect.right + 40 &&
            randomY > cardRect.top - 40 && randomY < cardRect.bottom + 40) {
            randomX = Math.random() * 60;
        }
        
        btnNo.style.position = "fixed";
        btnNo.style.left = `${randomX}px`;
        btnNo.style.top = `${randomY}px`;
      }

      btnNo.addEventListener("mouseenter", fleeNoButton);
      btnNo.addEventListener("click", fleeNoButton);

      btnYes.addEventListener("click", (e) => {
        // Starts playing the downloaded background lofi music automatically
        loadAndPlayAudio("birthday-lofi.mp3");
        
        triggerBurstConfetti(60, e.clientX, e.clientY);
        triggerStreamConfetti();
        
        stage2.classList.add("hidden");
        stage3.classList.remove("hidden");
      });

      // --- STAGE 3: BLOW OUT CANDLES ---
      btnBlow.addEventListener("click", () => {
        const flames = document.querySelectorAll(".flame");
        flames.forEach(f => f.classList.add("extinguished"));
        
        // Triggers your downloaded Happy Birthday celebration song instantly
        loadAndPlayAudio("happy-birthday.mp3");
        
        bdayBanner.classList.add("active");
        
        btnBlow.disabled = true;
        btnBlow.style.opacity = "0.5";
        btnBlow.innerText = "✨ Wishes sent up!";
        
        createBalloonsWave(25);
        triggerStreamConfetti();
        
        const balloonInterval = setInterval(() => {
          if(!stage4.classList.contains("hidden")) {
            createBalloonsWave(6);
          } else {
            clearInterval(balloonInterval);
          }
        }, 3000);

        setTimeout(() => {
          stage4.classList.remove("hidden");
          cardContainer.style.width = "520px";
          cardContainer.style.maxWidth = "95%";
          initializeTypewriter();
        }, 1200);
      });

      /* ==========================================================================
         E. STAGE 4: THE TYPEWRITER ENGINE
         ========================================================================== */
      const messageToType = "On this special day, I wanted to build something completely custom to remind you how amazing you are. May your year ahead be full of magic, unexpected laughter, and breathtaking breakthroughs. Happy Birthday! 💫🎈🎉";
      const txtContainer = document.getElementById("wish-text");
      const cursorNode = document.getElementById("txt-cursor");
      let charIdx = 0;

      function initializeTypewriter() {
        if (charIdx < messageToType.length) {
          txtContainer.textContent += messageToType.charAt(charIdx);
          charIdx++;
          setTimeout(initializeTypewriter, 50); 
        } else {
          cursorNode.style.animation = "none";
          cursorNode.style.opacity = "0";
          triggerBurstConfetti(40, window.innerWidth/2, window.innerHeight/2);
        }
      }

    });
  </script>
</body>
</html>
